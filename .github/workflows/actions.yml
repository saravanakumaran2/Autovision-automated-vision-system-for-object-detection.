name: Kubernetes Cluster Setup

on:
  workflow_dispatch:

jobs:
  master-setup:
    runs-on: self-hosted
    name: Setup Master Node (yolvo-master)
    if: runner.name == 'yolvo-master'
    outputs:
      join_command: ${{ steps.get_join_command.outputs.join_command }}
    steps:
      - name: Initialize Kubernetes master
        id: kubeinit
        run: |
          sudo kubeadm reset -f
          sudo kubeadm init --pod-network-cidr=10.244.0.0/16 | tee kubeadm-init.log

      - name: Setup kubeconfig for kubectl
        run: |
          mkdir -p $HOME/.kube
          sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
          sudo chown $(id -u):$(id -g) $HOME/.kube/config

      - name: Deploy Flannel CNI
        run: |
          kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

      - name: Extract kubeadm join command
        id: get_join_command
        run: |
          # Extract the join command from kubeadm-init.log
          join_cmd=$(grep -A2 "kubeadm join" kubeadm-init.log | tr -d '\r' | tr '\n' ' ')
          echo "::set-output name=join_command::$join_cmd"

      - name: Save join command to file artifact
        run: echo "${{ steps.get_join_command.outputs.join_command }}" > join_command.txt

      - uses: actions/upload-artifact@v3
        with:
          name: join-command
          path: join_command.txt

  worker-join:
    runs-on: self-hosted
    name: Join Worker Node (yolvo-worker)
    needs: master-setup
    if: runner.name == 'yolvo-worker'
    steps:
      - name: Download join command artifact
        uses: actions/download-artifact@v3
        with:
          name: join-command
          path: .

      - name: Join Kubernetes cluster
        run: |
          sudo kubeadm reset -f
          join_command=$(cat join_command.txt)
          echo "Running join command: $join_command"
          sudo $join_command

      - name: Verify node status
        run: |
          kubectl get nodes
