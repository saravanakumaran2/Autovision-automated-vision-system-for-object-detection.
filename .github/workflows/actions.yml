name: Kubernetes Cluster Setup

on:
  push:
    branches:
      - develop

jobs:
  setup-master:
    name: Setup Kubernetes Master
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Master Node
        run: |
          # Disable swap
          sudo swapoff -a
          sudo sed -i '/ swap / s/^/#/' /etc/fstab

          # Load kernel modules
          cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
          overlay
          br_netfilter
          EOF
          sudo modprobe overlay
          sudo modprobe br_netfilter

          # Setup sysctl params
          cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          EOF
          sudo sysctl --system

          # Install containerd and dependencies
          sudo apt-get update
          sudo apt-get install -y containerd apt-transport-https ca-certificates curl gnupg lsb-release conntrack

          sudo mkdir -p /etc/containerd
          containerd config default | sudo tee /etc/containerd/config.toml
          sudo sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
          sudo systemctl restart containerd
          sudo systemctl enable containerd

          # Add Kubernetes APT repo
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list

          sudo apt-get update

          # Get latest Kubernetes 1.29.x version
          K8S_VERSION=$(apt-cache madison kubeadm | grep 1.29 | head -1 | awk '{print $3}')
          echo "Using Kubernetes version: $K8S_VERSION"

          # Install kubelet, kubeadm, kubectl and hold them
          sudo apt-get install -y --allow-downgrades kubelet=$K8S_VERSION kubeadm=$K8S_VERSION kubectl=$K8S_VERSION
          sudo apt-mark hold kubelet kubeadm kubectl

      - name: Initialize Kubernetes Master
        run: |
          sudo kubeadm reset -f
          sudo kubeadm init --pod-network-cidr=10.244.0.0/16

          mkdir -p $HOME/.kube
          sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
          sudo chown $(id -u):$(id -g) $HOME/.kube/config

          export KUBECONFIG=$HOME/.kube/config

          # Apply Flannel CNI
          kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

          echo "Waiting for Flannel pods to be ready..."
          kubectl wait --for=condition=Ready pods -l k8s-app=flannel -n kube-system --timeout=180s

          # Generate and save the join command
          kubeadm token create --print-join-command > join_command.sh

      - name: Upload Join Command
        uses: actions/upload-artifact@v4
        with:
          name: join-command
          path: join_command.sh

  setup-worker:
    name: Setup Kubernetes Worker
    runs-on: ubuntu-latest
    needs: setup-master

    steps:
      - name: Prepare Worker Node
        run: |
          sudo swapoff -a
          sudo sed -i '/ swap / s/^/#/' /etc/fstab

          cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
          overlay
          br_netfilter
          EOF

          sudo modprobe overlay
          sudo modprobe br_netfilter

          cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          EOF

          sudo sysctl --system

          sudo apt-get update
          sudo apt-get install -y containerd apt-transport-https ca-certificates curl gnupg lsb-release conntrack

          sudo mkdir -p /etc/containerd
          containerd config default | sudo tee /etc/containerd/config.toml
          sudo sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
          sudo systemctl restart containerd
          sudo systemctl enable containerd

          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list

          sudo apt-get update

          K8S_VERSION=$(apt-cache madison kubeadm | grep 1.29 | head -1 | awk '{print $3}')
          echo "Using Kubernetes version: $K8S_VERSION"

          sudo apt-get install -y --allow-downgrades kubelet=$K8S_VERSION kubeadm=$K8S_VERSION kubectl=$K8S_VERSION
          sudo apt-mark hold kubelet kubeadm kubectl

      - name: Download Join Command
        uses: actions/download-artifact@v4
        with:
          name: join-command
          path: .

      - name: Join Cluster
        run: |
          chmod +x join_command.sh
          sudo ./join_command.sh
