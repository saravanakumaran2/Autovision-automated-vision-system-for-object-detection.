name: Kubernetes Dev Cluster Setup

on:
  push:
    branches:
      - develop

jobs:
  setup-k8s-cluster:
    runs-on: ubuntu-latest
    name: Setup Kubernetes Master + Worker (KinD)

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Docker (safe method)
      run: |
        sudo apt-get update
        sudo apt-get remove -y docker docker-engine docker.io containerd runc moby*
        sudo apt-get install -y \
          ca-certificates \
          curl \
          gnupg \
          lsb-release

        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

        echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
        $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    - name: Check Docker Version and Status
      run: |
        docker --version
        sudo systemctl start docker
        sudo systemctl enable docker

    - name: Install KinD
      run: |
        curl -Lo kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
        chmod +x kind
        sudo mv kind /usr/local/bin/kind

    - name: Install kubectl
      run: |
        export KUBECTL_VERSION=$(curl -s https://dl.k8s.io/release/stable.txt)
        curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/kubectl

    - name: Create Kubernetes Cluster (1 Master, 1 Worker)
      run: |
        cat <<EOF > kind-config.yaml
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
        - role: worker
        EOF

        kind create cluster --name object-detection-dev --config kind-config.yaml

    - name: Verify Cluster Nodes
      run: kubectl get nodes
