name: Kubernetes Cluster Setup

on:
  push:
    branches:
      - develop

jobs:
  setup-master:
    name: Setup Kubernetes Master
    runs-on: ubuntu-latest

    steps:
    - name: Prepare Master Node
      run: |
        sudo swapoff -a
        sudo sed -i '/ swap / s/^/#/' /etc/fstab

        cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
        overlay
        br_netfilter
        EOF

        sudo modprobe overlay
        sudo modprobe br_netfilter

        cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
        net.bridge.bridge-nf-call-ip6tables = 1
        net.bridge.bridge-nf-call-iptables = 1
        net.ipv4.ip_forward = 1
        EOF

        sudo sysctl --system

        sudo apt-get update && sudo apt-get install -y containerd apt-transport-https ca-certificates curl gnupg

        sudo mkdir -p /etc/containerd
        containerd config default | sudo tee /etc/containerd/config.toml

        sudo sed -i 's/^            SystemdCgroup = false/            SystemdCgroup = true/' /etc/containerd/config.toml

        sudo systemctl restart containerd
        sudo systemctl enable containerd

        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/kubernetes-apt-keyring.gpg

        echo "deb [signed-by=/etc/apt/trusted.gpg.d/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list

        sudo apt-get update
        sudo apt-get install -y kubelet kubeadm kubectl
        sudo apt-mark hold kubelet kubeadm kubectl

    - name: Initialize Kubernetes Master
      id: kubeadm-init
      run: |
        sudo kubeadm reset -f
        sudo kubeadm init --pod-network-cidr=10.244.0.0/16

        mkdir -p $HOME/.kube
        sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        sudo chown $(id -u):$(id -g) $HOME/.kube/config

        # Extract the join command for workers
        kubeadm token create --print-join-command > join_command.sh
        cat join_command.sh

    - name: Upload Join Command for Workers
      uses: actions/upload-artifact@v3
      with:
        name: join-command
        path: join_command.sh

  setup-worker:
    name: Setup Kubernetes Worker
    runs-on: [self-hosted, k8s-worker]
    needs: setup-master

    steps:
    - name: Prepare Worker Node
      run: |
        sudo swapoff -a
        sudo sed -i '/ swap / s/^/#/' /etc/fstab

        cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
        overlay
        br_netfilter
        EOF

        sudo modprobe overlay
        sudo modprobe br_netfilter

        cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
        net.bridge.bridge-nf-call-ip6tables = 1
        net.bridge.bridge-nf-call-iptables = 1
        net.ipv4.ip_forward = 1
        EOF

        sudo sysctl --system

        sudo apt-get update && sudo apt-get install -y containerd apt-transport-https ca-certificates curl gnupg

        sudo mkdir -p /etc/containerd
        containerd config default | sudo tee /etc/containerd/config.toml

        sudo sed -i 's/^            SystemdCgroup = false/            SystemdCgroup = true/' /etc/containerd/config.toml

        sudo systemctl restart containerd
        sudo systemctl enable containerd

        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/kubernetes-apt-keyring.gpg

        echo "deb [signed-by=/etc/apt/trusted.gpg.d/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list

        sudo apt-get update
        sudo apt-get install -y kubelet kubeadm kubectl
        sudo apt-mark hold kubelet kubeadm kubectl

    - name: Download Join Command from Master
      uses: actions/download-artifact@v3
      with:
        name: join-command
        path: .

    - name: Run Join Command to Join Cluster
      run: |
        chmod +x join_command.sh
        sudo ./join_command.sh
